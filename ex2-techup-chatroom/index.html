<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta http-equiv="X-UA-Compatible" content="IE=edge" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="stylesheet" href="./style.css" />
  <script src="https://kit.fontawesome.com/bf7220ad33.js" crossorigin="anonymous"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Sarabun&display=swap" rel="stylesheet">
  <title>Positioned Layout Exercise 2 TechUp Chatroom</title>
</head>

<body>
  <header> 
    <h2>Techup Chatroom</h2>
  </header>
  <div id="container">
    <div class="action">
        <div class="container-chat-box" id="first-chat">
            <span>สวัสดีจ้า</span>
            <div id="first-circle">1</div>
            <div id="second-circle">2</div>
        </div>
        <div class="container-chat-box" id="second-chat">
            <span>Coding สนุกจังเลย</span>
            <span id="tag">x</span>
        </div>        
        <div class="container-chat-box" id="trird-chat">
            <span>😍🤩</span>
        </div>
    </div>    
    <div class="response"> 
        <div class="container-chat-box" id="fourth-chat">
            <span>😍</span>
        </div>            
        <div class="container-chat-box" id="fifth-chat">
            <span>🥳</span>
        </div>    
    </div>
</div>
</body>

</html>
