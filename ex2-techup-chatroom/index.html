<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta http-equiv="X-UA-Compatible" content="IE=edge" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="stylesheet" href="./style.css" />
  <script src="https://kit.fontawesome.com/bf7220ad33.js" crossorigin="anonymous"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Sarabun&display=swap" rel="stylesheet">
  <title>Positioned Layout Exercise 2 TechUp Chatroom</title>
</head>

<body>
  <div class="chatroom-container">
    <div class="chatroom-header">
      Techup Chatroom
    </div>
    
    <div class="chatroom-messages">
      <!-- Outgoing messages (right side) -->
      <div class="message outgoing">
        <div class="message-bubble outgoing-bubble">
          สวัสดีจ้า
        </div>
      </div>
      
      <div class="message outgoing">
        <div class="message-bubble outgoing-bubble gray-bubble">
          Coding สนุกจังเลย
          <button class="close-btn">×</button>
        </div>
      </div>
      
      <div class="message outgoing">
        <div class="message-bubble outgoing-bubble">
          😍
        </div>
      </div>
      
      <div class="message incoming">
        <div class="message-bubble incoming-bubble">😍</div>
      </div>
      
      <div class="message incoming">
        <div class="message-bubble incoming-bubble">🥳</div>
      </div>
    </div>
  </div>
</body>

</html>
